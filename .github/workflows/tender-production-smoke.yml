name: Tender production smoke
on:
  push:
    branches:
      - spa-tender-prod-smoke-1001
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run gated production tender scan
        run: |
          node <<'NODE'
          const response = await fetch("https://spa-intelligence.onrender.com/api/tenders/internal-smoke", {
            headers: { "user-agent": "SPA-Intelligence-production-smoke/1.0" },
            signal: AbortSignal.timeout(120000),
          });
          const text = await response.text();
          console.log("status=" + response.status);
          console.log(text.slice(0, 30000));
          if (!response.ok) throw new Error("internal smoke returned " + response.status);
          const data = JSON.parse(text);
          if (!data.ok || !Array.isArray(data.results)) throw new Error("invalid internal smoke response");
          for (const result of data.results) {
            if (result.run.sourceSuccesses < 1) throw new Error("scan had no successful sources");
            if (!Array.isArray(result.records) || result.records.length < 1) throw new Error("scan persisted no tender records");
          }
          NODE
