services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - prospect-finder-redis:/data
    restart: unless-stopped

volumes:
  prospect-finder-redis:
